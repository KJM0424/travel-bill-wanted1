# 디자인 방향은 docs/design-notes.md 참고. 옅은 회색 바탕에 흰 카드, 진한 본문, 강조색은 '여권 초록' 하나.
# 색 값은 ui/layout.py의 :root 토큰과 같다.
[server]
# Pretendard 글꼴 파일(static/fonts)을 앱에서 직접 내려준다.
enableStaticServing = true

[client]
# Deploy 버튼·개발자 메뉴를 숨긴다.
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "45 920"

[theme]
base = "light"
font = "Pretendard, -apple-system, BlinkMacSystemFont, sans-serif"
codeFont = "Pretendard, -apple-system, BlinkMacSystemFont, sans-serif"
baseFontSize = 16
baseFontWeight = 500
codeFontSize = "15px"
codeFontWeight = 500
headingFontSizes = ["26px", "22px", "18px", "18px"]
headingFontWeights = [700, 700, 700]

backgroundColor = "#F3F5F4"
secondaryBackgroundColor = "#F1F3F2"
codeBackgroundColor = "#F1F3F2"
textColor = "#191F28"
primaryColor = "#17654C"
linkColor = "#17654C"
borderColor = "#E3E7E5"
dataframeBorderColor = "#E5E8EB"
dataframeHeaderBackgroundColor = "#F1F3F2"
redColor = "#C2362B"
greenColor = "#17654C"
greenBackgroundColor = "#E7F1EC"
greenTextColor = "#17654C"
blueBackgroundColor = "#E9EEF0"
blueTextColor = "#191F28"

paddingTop = "0.5rem"
paddingBottom = "2rem"
baseRadius = "14px"
buttonRadius = "14px"
showWidgetBorder = false
