# 디자인 방향은 docs/design-notes.md 참고. 감열지 영수증 위에 볼펜으로 고치는 느낌.
[theme]
base = "light"
backgroundColor = "#F4F5F2"
secondaryBackgroundColor = "#E6E8E3"
codeBackgroundColor = "#FFFFFF"
textColor = "#262A33"
primaryColor = "#2C46A0"
linkColor = "#2C46A0"
borderColor = "#C9CCC4"
redColor = "#B8372A"
greenColor = "#276B4A"
greenBackgroundColor = "#DCEAE0"
greenTextColor = "#1F5A3D"
blueColor = "#2C46A0"
font = "'IBM Plex Sans KR':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
codeFont = "'Nanum Gothic Coding':https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap"
codeFontSize = "0.95rem"
headingFontSizes = ["2rem", "1.5rem", "1.2rem"]
headingFontWeights = [700, 700, 500]
baseRadius = "0.35rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#E6E8E3"
dataframeBorderColor = "#C9CCC4"

[client]
toolbarMode = "minimal"
